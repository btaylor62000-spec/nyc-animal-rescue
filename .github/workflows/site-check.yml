# The live site, driven like a phone: zip and borough searches, location on,
# blocked, far away and vague. scripts/e2e/site-check.cjs says why.
# A failure fails this workflow, and GitHub emails the repository owner.
name: Site check (location, zip, borough)

on:
  schedule:
    - cron: '17 14 * * 2'   # Tuesdays, mid-morning New York time
  push:
    branches: [main]        # after every change that goes live
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Playwright only for this job; it is not a dependency of the site.
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      # Cloudflare takes about a minute to publish a push to main.
      - if: github.event_name == 'push'
        run: sleep 180
      - run: node scripts/e2e/site-check.cjs https://nyc-animal-rescue.pages.dev
